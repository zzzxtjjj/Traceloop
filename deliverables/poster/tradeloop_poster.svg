<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="800mm"
     height="1800mm"
     viewBox="0 0 800 1800"
     role="img"
     aria-labelledby="posterTitle posterDesc">
  <title id="posterTitle">TradeLoop 证据驱动的跨境业务改进闭环</title>
  <desc id="posterDesc">0.8 米乘 1.8 米纵向海报，展示业务问题、报价证据链、差评改进链、核心能力、安全边界、模拟数据说明和仓库地址。</desc>

  <defs>
    <linearGradient id="headerWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCEAF0"/>
      <stop offset="1" stop-color="#FFFCF7"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C6A36A"/>
    </marker>
    <style>
      .sans { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", "Microsoft YaHei", serif; }
      .ink { fill: #263B46; }
      .copy { fill: #4C514F; }
      .muted { fill: #7C8583; }
      .navy { fill: #29485A; }
      .coral { fill: #C75C48; }
      .white { fill: #FFFFFF; }
      .section { font-size: 22px; font-weight: 800; letter-spacing: 3px; }
      .body { font-size: 21px; }
      .small { font-size: 17px; }
      .node { font-size: 17px; font-weight: 700; }
    </style>
  </defs>

  <rect width="800" height="1800" fill="#FFFCF7"/>
  <rect width="800" height="420" fill="url(#headerWash)"/>
  <path d="M 0 375 C 180 430, 590 320, 800 390 L 800 455 L 0 455 Z" fill="#29485A" opacity="0.08"/>

  <g class="sans">
    <text x="70" y="82" class="coral" font-size="20" font-weight="800" letter-spacing="4">TRADELOOP</text>
    <text x="70" y="170" class="serif ink" font-size="66" font-weight="700">证据驱动的</text>
    <text x="70" y="248" class="serif ink" font-size="66" font-weight="700">跨境业务改进闭环</text>
    <rect x="70" y="286" width="290" height="8" fill="#C75C48"/>
    <rect x="360" y="286" width="150" height="8" fill="#C6A36A"/>
    <text x="70" y="345" class="copy" font-size="27">供应商报价、客户评价、改进任务和后续复检</text>
    <text x="70" y="383" class="copy" font-size="27">共享同一条可追溯、可审核的业务证据链</text>

    <g transform="translate(550 86)">
      <rect x="0" y="0" width="180" height="210" rx="6" fill="#FFFCF7" stroke="#29485A" stroke-width="2"/>
      <a href="https://github.com/zzzxtjjj/Traceloop" aria-label="打开 TradeLoop GitHub 仓库">
        <image x="25" y="25" width="130" height="130" href="repository_qr.svg" preserveAspectRatio="xMidYMid meet"/>
      </a>
      <text x="90" y="181" text-anchor="middle" class="navy" font-size="15">GitHub 仓库</text>
      <text x="90" y="201" text-anchor="middle" class="muted" font-size="11">扫描后仍需确认公开可访问</text>
    </g>

    <text x="70" y="500" class="navy section">业务问题</text>
    <text x="70" y="554" class="serif ink" font-size="36" font-weight="700">结论散落在文件和岗位之间</text>
    <g class="body copy">
      <circle cx="84" cy="610" r="7" fill="#E77D66"/>
      <text x="108" y="618">报价风险难以回到原始字段</text>
      <circle cx="84" cy="662" r="7" fill="#E77D66"/>
      <text x="108" y="670">差评结论与原文和统计口径脱节</text>
      <circle cx="84" cy="714" r="7" fill="#E77D66"/>
      <text x="108" y="722">任务完成缺少交付物和人工验收</text>
      <circle cx="84" cy="766" r="7" fill="#E77D66"/>
      <text x="108" y="774">前后变化容易被误写成因果证明</text>
    </g>

    <rect x="510" y="532" width="220" height="238" rx="8" fill="#29485A"/>
    <text x="540" y="584" class="white" font-size="23" font-weight="700">TradeLoop 的回答</text>
    <text x="540" y="634" class="white" font-size="20">
      <tspan x="540" dy="0">从原始证据出发</tspan>
      <tspan x="540" dy="40">经过人工确认</tspan>
      <tspan x="540" dy="40">留下任务交付记录</tspan>
      <tspan x="540" dy="40">再用同口径复检</tspan>
    </text>

    <text x="70" y="858" class="navy section">两条核心工作流</text>
    <text x="70" y="908" class="serif ink" font-size="34" font-weight="700">报价决策和差评改进使用同一套证据原则</text>

    <g transform="translate(70 958)">
      <text x="0" y="23" class="coral" font-size="22" font-weight="800">报价证据链</text>
      <g transform="translate(0 48)">
        <rect x="0" y="0" width="98" height="70" rx="6" fill="#DCEAF0"/>
        <text x="49" y="42" text-anchor="middle" class="node ink">报价导入</text>
        <line x1="104" y1="35" x2="126" y2="35" stroke="#C6A36A" stroke-width="3" marker-end="url(#arrow)"/>
        <rect x="135" y="0" width="98" height="70" rx="6" fill="#DCEAF0"/>
        <text x="184" y="42" text-anchor="middle" class="node ink">程序比较</text>
        <line x1="239" y1="35" x2="261" y2="35" stroke="#C6A36A" stroke-width="3" marker-end="url(#arrow)"/>
        <rect x="270" y="0" width="98" height="70" rx="6" fill="#DCEAF0"/>
        <text x="319" y="42" text-anchor="middle" class="node ink">原始字段</text>
        <line x1="374" y1="35" x2="396" y2="35" stroke="#C6A36A" stroke-width="3" marker-end="url(#arrow)"/>
        <rect x="405" y="0" width="98" height="70" rx="6" fill="#DCEAF0"/>
        <text x="454" y="42" text-anchor="middle" class="node ink">风险确认</text>
        <line x1="509" y1="35" x2="531" y2="35" stroke="#C6A36A" stroke-width="3" marker-end="url(#arrow)"/>
        <rect x="540" y="0" width="118" height="70" rx="6" fill="#DCEAF0"/>
        <text x="599" y="42" text-anchor="middle" class="node ink">交付验收</text>
      </g>
    </g>

    <g transform="translate(70 1110)">
      <text x="0" y="23" class="coral" font-size="22" font-weight="800">差评改进链</text>
      <g transform="translate(0 48)">
        <rect x="0" y="0" width="98" height="70" rx="6" fill="#F8E4DF"/>
        <text x="49" y="42" text-anchor="middle" class="node ink">评价去重</text>
        <line x1="104" y1="35" x2="126" y2="35" stroke="#C6A36A" stroke-width="3" marker-end="url(#arrow)"/>
        <rect x="135" y="0" width="98" height="70" rx="6" fill="#F8E4DF"/>
        <text x="184" y="42" text-anchor="middle" class="node ink">程序统计</text>
        <line x1="239" y1="35" x2="261" y2="35" stroke="#C6A36A" stroke-width="3" marker-end="url(#arrow)"/>
        <rect x="270" y="0" width="98" height="70" rx="6" fill="#F8E4DF"/>
        <text x="319" y="42" text-anchor="middle" class="node ink">原文证据</text>
        <line x1="374" y1="35" x2="396" y2="35" stroke="#C6A36A" stroke-width="3" marker-end="url(#arrow)"/>
        <rect x="405" y="0" width="98" height="70" rx="6" fill="#F8E4DF"/>
        <text x="454" y="42" text-anchor="middle" class="node ink">人工审核</text>
        <line x1="509" y1="35" x2="531" y2="35" stroke="#C6A36A" stroke-width="3" marker-end="url(#arrow)"/>
        <rect x="540" y="0" width="118" height="70" rx="6" fill="#F8E4DF"/>
        <text x="599" y="42" text-anchor="middle" class="node ink">后续复检</text>
      </g>
    </g>

    <text x="70" y="1322" class="navy section">核心能力</text>
    <g transform="translate(70 1355)">
      <line x1="0" y1="0" x2="660" y2="0" stroke="#29485A" stroke-width="2" opacity="0.22"/>
      <g transform="translate(0 34)">
        <text x="0" y="0" class="ink" font-size="25" font-weight="800">01</text>
        <text x="52" y="0" class="ink" font-size="23" font-weight="700">原始证据引用</text>
        <text x="52" y="34" class="muted small">报价字段、评价 ID、CSV 行号和原文片段</text>
      </g>
      <g transform="translate(350 34)">
        <text x="0" y="0" class="ink" font-size="25" font-weight="800">02</text>
        <text x="52" y="0" class="ink" font-size="23" font-weight="700">结构化人工审核</text>
        <text x="52" y="34" class="muted small">接受、修改、驳回和审核记录</text>
      </g>
      <g transform="translate(0 124)">
        <text x="0" y="0" class="ink" font-size="25" font-weight="800">03</text>
        <text x="52" y="0" class="ink" font-size="23" font-weight="700">任务交付闭环</text>
        <text x="52" y="34" class="muted small">责任岗位、验收材料和复检关联</text>
      </g>
      <g transform="translate(350 124)">
        <text x="0" y="0" class="ink" font-size="25" font-weight="800">04</text>
        <text x="52" y="0" class="ink" font-size="23" font-weight="700">失败安全处理</text>
        <text x="52" y="34" class="muted small">错误不污染关键业务状态</text>
      </g>
    </g>

    <rect x="0" y="1555" width="800" height="245" fill="#29485A"/>
    <text x="70" y="1610" class="white section">安全边界和演示说明</text>
    <g class="white" font-size="18">
      <text x="70" y="1660">模型或规则提出发现，程序负责统计，关键结论由人工确认。</text>
      <text x="70" y="1696">缺少可靠关联时显示缺失，不根据相似名称绑定订单、批次或供应商。</text>
      <text x="70" y="1732">本海报使用模拟数据说明工作流。规则检查不等于法律意见或平台审核。</text>
    </g>
    <text x="70" y="1774" fill="#BFD9E2" font-size="17">github.com/zzzxtjjj/Traceloop</text>
    <text x="730" y="1774" text-anchor="end" fill="#BFD9E2" font-size="15">800mm × 1800mm</text>
  </g>
</svg>
